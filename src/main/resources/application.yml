server:
  port: 8080

spring:
  application:
    name: shiguangji-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/shiguangji?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # dev：SQL 打到 stdout
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted   # 逻辑删除
      id-type: assign_id            # 雪花 ID

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

shiguangji:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    access-ttl: 2h
    refresh-ttl: 30d
  upload:
    dir: ${UPLOAD_DIR:./uploads}

logging:
  file:
    name: ${LOG_DIR:./logs}/app.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
