name: shiguangji
description: 食光记 - 个人食谱管理 App（深色玻璃主题，Android 优先 / Web 预览）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # 网络
  dio: ^5.4.0
  # 路由
  go_router: ^14.0.0
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 图片缓存
  cached_network_image: ^3.3.0
  # 本地存储（Token 持久化）
  shared_preferences: ^2.2.0
  # 图片选择
  image_picker: ^1.0.7
  # 瀑布流
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 字体：使用系统字体；正式版可下载 Noto Sans SC 放 assets/fonts/
  assets:
    - assets/categories/
